<!doctype html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Build your Consulting Week</title>

    <style>

        /* =========================================================
           DESIGN VARIABLES
           ========================================================== */

        :root {
            --red:#e20015;
            --blue:#005691;
            --navy:#003b6a;
            --turq:#00879a;
            --green:#00884a;
            --purple:#6e3f88;
            --analysis:#3f464c;
            --text:#20262b;
            --muted:#66717a;
            --line:#e1e5e8;
            --slot:34px;
        }

        /* ==========================================================
           GLOBAL STYLES
           ========================================================== */

        * {
            box-sizing:border-box;
        }

        html {
            color-scheme:light;
        }

        body {
            margin:0;
            color:var(--text);
            background:#fff;
            font-family:"Segoe UI",Arial,sans-serif;
        }

        body:before {
            display:block;
            height:3px;
            content:"";
            background:linear-gradient(
                90deg,
                #e20015 0 15%,
                #6e3f88 15% 29%,
                #23a8df 29% 52%,
                #20a9b5 52% 72%,
                #29a36a 72% 87%,
                #d3a84b 87%
            );
        }

        /* ==========================================================
           HEADER
           ========================================================== */

        header {
            padding:18px 30px;
            color:#f3f6f8;
            background:#0f151b;
            border-bottom:1px solid #2b3742;
            box-shadow:0 8px 28px #0004;
        }

        .header-row {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:28px;
        }

        .brand {
            flex:1 1 auto;
            min-width:340px;
        }

        .brand .task {
            max-width:620px;
            margin-top:5px;
            text-align:left;
        }

        .eyebrow {
            color:#23a8df;
            font-size:9px;
            font-weight:800;
            letter-spacing:.16em;
            text-transform:uppercase;
        }

        .header-menu {
            display:flex;
            flex:0 0 auto;
            flex-direction:column;
            align-items:flex-start;
            justify-content:center;
            width:max-content;
            max-width:100%;
            gap:11px;
        }

        h1 {
            margin:4px 0 0;
            color:#f3f6f8;
            font-size:clamp(28px,3vw,42px);
            font-weight:750;
            letter-spacing:-.035em;
        }

        .task {
            margin:0;
            color:#a6b1ba;
            font-size:12px;
            line-height:1.4;
        }

        .toolbar {
            display:flex;
            flex-wrap:nowrap;
            justify-content:flex-start;
            gap:8px;
            width:max-content;
            max-width:100%;
        }

        .btn {
            padding:9px 13px;
            color:#dce5eb;
            background:#151d24;
            border:1px solid #35434e;
            border-radius:2px;
            font-size:11px;
            font-weight:700;
            cursor:pointer;
        }

        .btn:hover {
            color:#fff;
            background:#202b34;
            border-color:#536574;
        }

        .btn.primary {
            color:#071015;
            background:#23a8df;
            border-color:#23a8df;
            font-weight:800;
        }

        .btn.primary:hover {
            background:#58bee7;
            border-color:#58bee7;
        }

</style>
<script>
"use strict";

/* ==========================================================
   CONFIGURATION
   ========================================================== */

const CONFIG = {
    storageKey: "consultingWeekDurationV1",

    weekdays: [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday"
    ],

    startMinutes: 480,
    endMinutes: 1200,
    slotMinutes: 30
};

/* ==========================================================
   CATEGORIES
   ========================================================== */

const CATEGORIES = {
    client: {
        label: "Client Activities",
        color: "#00884a"
    },

    team: {
        label: "Team / Partner",
        color: "#005691"
    },

    analysis: {
        label: "Analysis & Delivery",
        color: "#333333"
    },

    internal: {
        label: "Internal Development",
        color: "#6e3f88"
    },

    travel: {
        label: "Travel",
        color: "#e20015"
    },

    meal: {
        label: "Lunch / Event",
        color: "#00879a"
    }
};

/* ==========================================================
   ACTIVITIES
   ========================================================== */

const ACTIVITIES = [

    ["travel-to", "Travel to Client", "travel", 1, 120],
    ["travel-from", "Travel from Client", "travel", 1, 120],

    ["lunch-team", "Lunch with Team", "meal", 1, 60],
    ["lunch-client", "Lunch with Client", "meal", 2, 60],
    ["working-lunch", "Working Lunch Session", "meal", 1, 90],
    ["lunch-domain", "Lunch with Domain", "meal", 1, 60],
    ["team-event", "Team Dinner / Event", "meal", 1, 120],

    ["team-checkin", "Team Check-in", "team", 5, 30],
    ["team-checkout", "Team Check-out", "team", 5, 30],
    ["problem", "Team Problem Solving", "team", 2, 120],
    ["partner", "Debrief with Partner", "team", 1, 60],

    ["client-checkin", "Client Check-in", "client", 3, 30],
    ["client-work", "Client Work Session", "client", 2, 120],
    ["steerco", "SteerCo", "client", 1, 90],
    ["expert", "Expert Interviews", "client", 1, 90],

    ["data", "Prepare Data Requests", "analysis", 1, 60],
    ["draft-market", "Draft Market Model", "analysis", 1, 120],
    ["refine-market", "Refine Market Model", "analysis", 1, 120],
    ["review-data", "Review Data", "analysis", 1, 90],
    ["review-input", "Review Client / Expert Input", "analysis", 1, 60],
    ["update-model", "Update Model", "analysis", 1, 90],
    ["build-model", "Build Model in Excel", "analysis", 1, 120],
    ["draft-slides", "Draft Analysis Slides", "analysis", 1, 120],
    ["final-slides", "Finalize Analysis Slides", "analysis", 1, 120],
    ["prepare-steerco", "Prepare SteerCo", "analysis", 1, 90],
    ["send-steerco", "Finalize & Send SteerCo", "analysis", 1, 60],
    ["challenge", "Challenge Assumptions", "analysis", 1, 60],

    ["training", "Online Training", "internal", 1, 60],
    ["feedback", "Feedback Session", "internal", 2, 60],
    ["admin", "Admin / Expenses", "internal", 1, 60],
    ["recruiting", "Recruiting Interview", "internal", 1, 60]

].map(
    ([id, label, category, max, duration]) => ({
        id,
        label,
        category,
        max,
        duration
    })
);

/* ==========================================================
   APPLICATION STATE & HELPERS
   ========================================================== */

const state = {
    dragged: null,
    nextId: 1
};

const $ = s => document.querySelector(s);

const $$ = s => [
    ...document.querySelectorAll(s)
];

const activity = id =>
    ACTIVITIES.find(a => a.id === id);

const fmt = m =>
    `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;

const dur = m =>
    m < 60
        ? `${m} min`
        : m % 60
            ? `${Math.floor(m / 60)}h ${m % 60}m`
            : `${m / 60}h`;

/* ==========================================================
   INVENTORY
   ========================================================== */

function notice(t) {
    const e = $("#toast");

    e.textContent = t;
    e.style.display = "block";

    clearTimeout(notice.t);

    notice.t = setTimeout(
        () => e.style.display = "none",
        1800
    );
}

function placed() {
    return $$(".event").map(e => ({
        activityId: e.dataset.activityId,
        instanceId: e.dataset.instanceId,
        day: +e.dataset.day,
        start: +e.dataset.start,
        duration: +e.dataset.duration,
        category: activity(e.dataset.activityId).category
    }));
}

function remaining(id) {
    const a = activity(id);

    return a
        ? Math.max(
            0,
            a.max -
            $$(`.event[data-activity-id="${id}"]`).length
        )
        : 0;
}

function updateInventory() {
    $$(".source").forEach(e => {

        const n = remaining(
            e.dataset.activityId
        );

        e.querySelector(".badge").textContent = n;
        e.hidden = n === 0;
        e.draggable = n > 0;

    });
}

/* ==========================================================
   CALENDAR HELPERS
   ========================================================== */

const slot = (d, s) =>
    $(`.slot[data-day="${d}"][data-start="${s}"]`);

function range(d, s, n) {

    let a = [];

    for (
        let m = s;
        m < s + n;
        m += CONFIG.slotMinutes
    ) {
        let x = slot(d, m);

        if (!x) {
            return null;
        }

        a.push(x);
    }

    return a;
}

function clearOcc(e) {

    $$(`.slot[data-event-id="${e.dataset.instanceId}"]`)
        .forEach(s => {
            s.classList.remove("occupied");
            delete s.dataset.eventId;
        });
}

function canPlace(d, s, n, ignore = null) {

    let r = range(d, s, n);

    return (
        s + n <= CONFIG.endMinutes &&
        !!r &&
        r.every(
            x =>
                !x.dataset.eventId ||
                x.dataset.eventId === ignore
        )
    );
}

/* ==========================================================
   EVENT MANAGEMENT
   ========================================================== */

function createEvent(a, id = null) {

    let e = document.createElement("div");

    e.className = `card event ${a.category}`;

    Object.assign(e.dataset, {
        activityId: a.id,
        instanceId: id || `event-${state.nextId++}`,
        duration: a.duration
    });

    e.innerHTML = `
        <span>
            <span class="event-title">${a.label}</span>
            <span class="event-time"></span>
        </span>
        <button
            class="remove"
            type="button"
            title="Remove this assignment"
        >×</button>
    `;

    e.querySelector(".remove").onclick = v => {
        v.stopPropagation();
        clearOcc(e);
        e.remove();
        updateInventory();
    };

    enableDrag(e);

    return e;
}

function positionEvent(e, d, s) {

    let a = activity(e.dataset.activityId),
        r = range(d, s, a.duration);

    if (!r) {
        return;
    }

    clearOcc(e);

    Object.assign(e.dataset, {
        day: d,
        start: s
    });

    e.style.height =
        `calc(${a.duration / CONFIG.slotMinutes} * var(--slot) - 4px)`;

    e.querySelector(".event-time").textContent =
        `${fmt(s)}–${fmt(s + a.duration)} · ${dur(a.duration)}`;

    r.forEach(x => {
        x.dataset.eventId = e.dataset.instanceId;
        x.classList.add("occupied");
    });

    r[0].append(e);
}

function dropAt(d, s) {

    if (!state.dragged) {
        return;
    }

    let id = state.dragged.dataset.activityId,
        a = activity(id),
        moving = !state.dragged.classList.contains("source"),
        ignore = moving
            ? state.dragged.dataset.instanceId
            : null;

    if (!canPlace(d, s, a.duration, ignore)) {

        let x = slot(d, s);

        x?.classList.add("invalid");

        setTimeout(
            () => x?.classList.remove("invalid"),
            350
        );

        notice(
            s + a.duration > CONFIG.endMinutes
                ? "The activity does not fit within the visible working day."
                : "One or more required time slots are already occupied."
        );

        return;
    }

    if (!moving && remaining(id) <= 0) {

        notice(
            "This activity has reached its maximum usage."
        );

        return;
    }

    let e = moving
        ? state.dragged
        : createEvent(a);

    positionEvent(e, d, s);

    updateInventory();
}

/* ==========================================================
   LIBRARY
   ========================================================== */

function buildLibrary() {

    let l = $("#library");

    Object.entries(CATEGORIES)
        .forEach(([k, c], i) => {

            let g = document.createElement("details");

            g.className = "group";
            g.open = i === 0;

            g.innerHTML = `
                <summary>
                    <span
                        class="dot"
                        style="background:${c.color}"
                    ></span>
                    ${c.label}
                </summary>
                <div class="cards"></div>
            `;

            ACTIVITIES
                .filter(a => a.category === k)
                .forEach(a => {

                    let e =
                        document.createElement("div");

                    e.className =
                        `card source ${a.category}`;

                    e.dataset.activityId = a.id;

                    e.innerHTML = `
                        <span>
                            <span>${a.label}</span>
                            <br>
                            <span class="meta">
                                ${dur(a.duration)}
                            </span>
                        </span>
                        <span class="badge">
                            ${a.max}
                        </span>
                    `;

                    enableDrag(e);

                    g.querySelector(".cards")
                        .append(e);
                });

            l.append(g);
        });

    updateInventory();
}

/* ==========================================================
   SAVE & LOAD
   ========================================================== */

function clearAll() {

    $$(".event").forEach(e => {
        clearOcc(e);
        e.remove();
    });

    updateInventory();
}

function save() {

    localStorage.setItem(
        CONFIG.storageKey,
        JSON.stringify(placed())
    );

    notice(
        "Your week has been saved in this browser."
    );
}

function load() {

    let data = JSON.parse(
        localStorage.getItem(CONFIG.storageKey) || "[]"
    );

    clearAll();

    data.forEach(x => {

        let a = activity(x.activityId);

        if (
            a &&
            canPlace(
                x.day,
                x.start,
                a.duration
            ) &&
            remaining(a.id) > 0
        ) {
            positionEvent(
                createEvent(a, x.instanceId),
                x.day,
                x.start
            );
        }
    });

    updateInventory();

    notice(
        data.length
            ? "Saved week loaded."
            : "No saved week was found."
    );
}

/* ==========================================================
   EVALUATION
   ========================================================== */

function evaluate() {

    let p = placed(),

        count = c =>
            p.filter(x => x.category === c).length,

        days = c =>
            new Set(
                p.filter(x => x.category === c)
                    .map(x => x.day)
            ).size,

        hours = c =>
            p.filter(x => x.category === c)
                .reduce(
                    (s, x) => s + x.duration / 60,
                    0
                ),

        m = [
            ["Client Impact", Math.min(30, Math.round(hours("client") * 6)), 30],
            ["Team Collaboration", Math.min(20, count("team") + days("team") * 2), 20],
            ["Analysis & Delivery", Math.min(20, Math.round(hours("analysis") * 2)), 20],
            ["Learning & Internal", Math.min(10, count("internal") * 3), 10],
            ["Sustainability", Math.min(20, days("meal") * 4), 20]
        ],

        total = m.reduce(
            (s, x) => s + x[1],
            0
        );

    $("#score").textContent =
        `${total}/100`;

    $("#metrics").innerHTML =
        m.map(
            x => `
                <div class="metric">
                    <strong>
                        ${x[0]}: ${x[1]}/${x[2]}
                    </strong>
                    <div class="bar">
                        <div
                            class="fill"
                            style="width:${x[1] / x[2] * 100}%"
                        ></div>
                    </div>
                </div>
            `
        ).join("");

    let f = [];

    if (hours("client") < 4) {
        f.push(
            "Increase client-facing time to strengthen stakeholder impact."
        );
    }

    if (hours("analysis") < 5) {
        f.push(
            "Protect more dedicated analysis and delivery time."
        );
    }

    if (days("team") < 4) {
        f.push(
            "Distribute team alignment more consistently across the week."
        );
    }

    if (days("meal") < 4) {
        f.push(
            "Plan proper breaks on most weekdays."
        );
    }

    if (count("internal") < 1) {
        f.push(
            "Include at least one professional development or internal activity."
        );
    }

    $("#feedback").innerHTML =
        f.map(x => `<li>${x}</li>`).join("") ||
        "<li>The week shows a balanced mix of core consulting activities.</li>";

    $("#scoreModal").classList.add("open");
}

/* ==========================================================
   INITIALIZATION
   ========================================================== */

function init() {

    createSlots();
    buildLibrary();

    $("#evaluate").onclick = evaluate;

    $("#reset").onclick = () =>
        confirm("Reset all activity assignments?")
        && clearAll();

    $("#save").onclick = save;
    $("#load").onclick = load;

    $$("[data-close]").forEach(
        b =>
            b.onclick = () =>
                $("#" + b.dataset.close)
                    .classList.remove("open")
    );

    $$(".modal").forEach(
        m =>
            m.onclick = e =>
                e.target === m &&
                m.classList.remove("open")
    );

    document.onkeydown = e =>
        e.key === "Escape" &&
        $$(".modal.open").forEach(
            m => m.classList.remove("open")
        );
}

init();

</script>
</body>
</html>
